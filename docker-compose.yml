# Compose stack for pio-bun-minimal-boilerplate.
#
# Usage:
#   docker compose up --build        # build & run server on :3000
#   docker compose up -d             # detached
#   docker compose down              # stop
#
# Override with .env (see .env.example) or `env_file:` below.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pio-bun-minimal-boilerplate:local
    container_name: pio-bun-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: /app/logs
      API_BASE_URL: ${API_BASE_URL:-https://jsonplaceholder.typicode.com}
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-10000}
    volumes:
      - app-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Drop privileges inside the container.
    security_opt:
      - no-new-privileges:true
    # Tiny memory cap; bump as needed.
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  app-logs:
    driver: local
